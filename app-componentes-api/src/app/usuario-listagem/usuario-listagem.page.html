<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>API</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-list>
    @for(item of users; track item.id){
    <ion-item>
      <ion-label>{{item.first_name}}</ion-label>
      <ion-button (click)="remover(item.id)"> Remover </ion-button>
    </ion-item>
    }
  </ion-list>

</ion-content>

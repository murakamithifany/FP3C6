<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Lista de Vendas
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item>
      <ion-select label="Venda" label-placement="cliente" (ionChange)="selecionarCliente($event)">
        @for(venda of vendas(); track venda.cliente){
        <ion-select-option [value]="venda">
          {{venda.cliente}} - {{venda.data}}
        </ion-select-option>
        }
      </ion-select>
      <ion-button>Excluir</ion-button>
    </ion-item>
  </ion-list>

  <ion-grid>
    <ion-row>
      <ion-col>Produto</ion-col>
      <ion-col>Qtd</ion-col>
      <ion-col>Preço Unit.</ion-col>
      <ion-col> Subtotal </ion-col>
    </ion-row>

    @for(item of itensVenda(); track item){
    <ion-row>
      <ion-col><ion-label>{{item.produto}}</ion-label></ion-col>
      <ion-col><ion-label>{{item.quantidade}}</ion-label></ion-col>
      <ion-col><ion-label>{{item.valorUnitario}}</ion-label></ion-col>
      <ion-col><ion-label> </ion-label></ion-col>
    </ion-row>
    }@empty{
    <p>Selecione uma venda</p>
    }

  </ion-grid>

</ion-content>

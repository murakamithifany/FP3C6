<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Alterar Item</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="form">
    <ion-list>
      <ion-item>
        <ion-input label="Produto" formControlName="produto"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Quantidade" type="number" formControlName="quantidade"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Valor unitário" type="number" formControlName="valorUnitario"></ion-input>
      </ion-item>
      <ion-button (click)="alterar()">
        Salvar alteração
      </ion-button>
      <ion-button routerLink="/home" color="danger">Cancelar</ion-button>
    </ion-list>
  </form>
</ion-content>

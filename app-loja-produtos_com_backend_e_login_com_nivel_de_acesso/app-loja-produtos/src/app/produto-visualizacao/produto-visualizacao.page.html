<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Dados do Produto</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (produto(); as p) {
  <ion-grid>
    <ion-row>
      <ion-col size="4"><strong>Nome</strong></ion-col>
      <ion-col>{{ p.nome }}</ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="4"><strong>Categoria</strong></ion-col>
      <ion-col>{{ p.categoria?.nome }}</ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="4"><strong>Preço</strong></ion-col>
      <ion-col>{{ p.preco | currency:'BRL':'symbol':'1.2-2' }}</ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="4"><strong>Quantidade</strong></ion-col>
      <ion-col>{{ p.quantidade }}</ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="4"><strong>Fornecedor</strong></ion-col>
      <ion-col>{{ p.fornecedor }}</ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="4"><strong>Valor em estoque</strong></ion-col>
      <ion-col>{{ valorEmEstoque() | currency:'BRL':'symbol':'1.2-2' }}</ion-col>
    </ion-row>

    <ion-button routerLink="/home">
      <ion-icon name="return-down-back-outline"></ion-icon>
    </ion-button>
  </ion-grid>
  }
</ion-content>

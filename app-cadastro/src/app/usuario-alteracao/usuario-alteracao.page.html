<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Alteração do Usuário</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="form">
    <ion-list>
      <ion-item>
        <ion-input label="Primeiro Nome" labelPlacement="stacked" formControlName="first_name"></ion-input>
      </ion-item>

      <ion-item>
        <ion-input label="Último Nome" labelPlacement="stacked" formControlName="last_name"></ion-input>
      </ion-item>

      <ion-item>
        <ion-input label="E-mail" labelPlacement="stacked" formControlName="email"></ion-input>
      </ion-item>

      <ion-button (click)="alterar()">Salvar</ion-button>
      <ion-button routerLink="/home" color="danger">Cancelar</ion-button>
    </ion-list>
  </form>
</ion-content>

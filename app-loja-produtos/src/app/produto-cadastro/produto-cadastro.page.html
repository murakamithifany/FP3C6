<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Cadastro de Produto</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="form">
    <ion-list>
      <ion-item>
        <ion-input label="Nome" labelPlacement="stacked" formControlName="nome"></ion-input>
      </ion-item>

      <ion-item>
        <ion-select label="Categoria" label-placement="categoria" formControlName="categoria">
          @for(categoria of categorias; track categoria){
          <ion-select-option [value]="categoria">
            {{categoria}}
          </ion-select-option>
          }
        </ion-select>
      </ion-item>

      <ion-item>
        <ion-input min="1" label="Preço" labelPlacement="stacked" type="number" formControlName="preco"></ion-input>
      </ion-item>

      <ion-item>
        <ion-input min="1" label="Quantidade" type="number" labelPlacement="stacked" formControlName="quantidade"></ion-input>
      </ion-item>

      <ion-item>
        <ion-input label="Fornecedor" labelPlacement="stacked" formControlName="fornecedor"></ion-input>
      </ion-item>

      <ion-button (click)="cadastrar()">
        <ion-icon name="checkmark-outline"></ion-icon>
      </ion-button>
      <ion-button routerLink="/home" color="danger">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-list>
  </form>
</ion-content>
